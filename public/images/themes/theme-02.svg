<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="catGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ba9c66" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f8f5ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <rect width="100%" height="100%" fill="url(#catGlow)"/>
  <!-- Catalytic center & solar orbital rays -->
  <g stroke="#ba9c66" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <ellipse cx="200" cy="150" rx="140" ry="70" stroke-dasharray="4 4" transform="rotate(-20 200 150)"/>
    <ellipse cx="200" cy="150" rx="140" ry="70" stroke-dasharray="4 4" transform="rotate(40 200 150)"/>
    <ellipse cx="200" cy="150" rx="90" ry="90" stroke-opacity="0.25"/>
  </g>
  <!-- Solar energy / photon beam -->
  <g stroke="#ba9c66" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 3">
    <line x1="60" y1="40" x2="190" y2="140"/>
    <line x1="90" y1="30" x2="200" y2="135"/>
    <line x1="120" y1="20" x2="210" y2="130"/>
  </g>
  <!-- Catalytic active metal node & ligand coordination -->
  <g fill="#222d47" fill-opacity="0.4">
    <circle cx="200" cy="150" r="14" fill="#ba9c66" fill-opacity="0.6"/>
    <circle cx="200" cy="150" r="7" fill="#222d47"/>
    <circle cx="130" cy="115" r="5"/>
    <circle cx="270" cy="185" r="5"/>
    <circle cx="145" cy="205" r="5"/>
    <circle cx="255" cy="95" r="5"/>
  </g>
  <g stroke="#222d47" stroke-width="1.5" stroke-opacity="0.35">
    <line x1="200" y1="150" x2="130" y2="115"/>
    <line x1="200" y1="150" x2="270" y2="185"/>
    <line x1="200" y1="150" x2="145" y2="205"/>
    <line x1="200" y1="150" x2="255" y2="95"/>
  </g>
</svg>
