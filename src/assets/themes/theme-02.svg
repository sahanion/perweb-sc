<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2a1f3d"/>
      <stop offset="60%" stop-color="#181324"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="catalystCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="tealNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="laserGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>
  <rect width="100%" height="100%" fill="url(#sunGlow)"/>

  <!-- Solar Photon Beams striking active site -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.75" filter="url(#laserGlow)">
    <line x1="60" y1="40" x2="280" y2="195"/>
    <line x1="110" y1="30" x2="300" y2="205"/>
    <line x1="160" y1="20" x2="320" y2="215"/>
  </g>

  <!-- Catalytic Macrocycle Ring & Electron Orbitals -->
  <g stroke="#fb923c" stroke-width="2" stroke-opacity="0.6" fill="none">
    <ellipse cx="300" cy="210" rx="170" ry="75" stroke-dasharray="6 6" transform="rotate(-15 300 210)"/>
    <ellipse cx="300" cy="210" rx="170" ry="75" stroke-dasharray="6 6" transform="rotate(35 300 210)"/>
    <circle cx="300" cy="210" r="105" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- Metalloporphyrin Coordination Chelation Arms -->
  <g stroke="#d4af37" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="210" x2="210" y2="160"/>
    <line x1="300" y1="210" x2="390" y2="160"/>
    <line x1="300" y1="210" x2="230" y2="280"/>
    <line x1="300" y1="210" x2="370" y2="280"/>
  </g>

  <!-- Central Catalytic Metal Center -->
  <circle cx="300" cy="210" r="18" fill="url(#catalystCore)" filter="url(#laserGlow)"/>
  <circle cx="300" cy="210" r="8" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Coordinating Ligand Atoms -->
  <circle cx="210" cy="160" r="9" fill="url(#tealNode)"/>
  <circle cx="390" cy="160" r="9" fill="url(#tealNode)"/>
  <circle cx="230" cy="280" r="9" fill="url(#tealNode)"/>
  <circle cx="370" cy="280" r="9" fill="url(#tealNode)"/>

  <!-- CO2 Molecular Conversion Flux (O=C=O) -->
  <g filter="url(#laserGlow)">
    <!-- Approaching CO2 -->
    <circle cx="160" cy="100" r="6" fill="#ef4444"/>
    <line x1="160" y1="100" x2="180" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="180" cy="100" r="7" fill="#64748b"/>
    <line x1="180" y1="100" x2="200" y2="100" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="200" cy="100" r="6" fill="#ef4444"/>

    <!-- Converted product CO / Fuel departing -->
    <circle cx="430" cy="290" r="6" fill="#ef4444"/>
    <line x1="430" y1="290" x2="448" y2="290" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="448" cy="290" r="7" fill="#64748b"/>
  </g>
</svg>
