<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#361a29"/>
      <stop offset="60%" stop-color="#210e18"/>
      <stop offset="100%" stop-color="#0f050b"/>
    </radialGradient>
    <radialGradient id="drugSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="goldPayload" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <radialGradient id="vesicleGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="nanoGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad4)"/>

  <!-- Spherical NanoCOF Nanocarrier Shell -->
  <circle cx="270" cy="210" r="115" fill="url(#vesicleGlow)"/>

  <!-- Porous Outer Shell with Open Gating Channels -->
  <g stroke="#f43f5e" stroke-width="2.5" fill="none">
    <!-- Outer boundary with gate gaps -->
    <path d="M165,170 A115,115 0 0,1 270,95" stroke-dasharray="10 5"/>
    <path d="M300,98 A115,115 0 0,1 380,180" stroke-width="3" stroke="#fb7185"/>
    <!-- Open release gate pore on right -->
    <path d="M375,250 A115,115 0 0,1 270,325" stroke-dasharray="10 5"/>
    <path d="M230,320 A115,115 0 0,1 160,240" stroke-width="3" stroke="#fb7185"/>
    <path d="M155,230 A115,115 0 0,1 165,170" stroke-width="2.5"/>

    <!-- Concentric Inner Porous Reticular Framework Structure -->
    <circle cx="270" cy="210" r="85" stroke="#d4af37" stroke-width="1.8" stroke-dasharray="6 4" stroke-opacity="0.6"/>
    <circle cx="270" cy="210" r="55" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Encapsulated Therapeutic Drug Payloads Inside NanoCOF -->
  <g filter="url(#nanoGlow)">
    <circle cx="240" cy="180" r="13" fill="url(#drugSphere)"/>
    <circle cx="280" cy="170" r="12" fill="url(#goldPayload)"/>
    <circle cx="230" cy="225" r="11" fill="url(#goldPayload)"/>
    <circle cx="270" cy="215" r="14" fill="url(#drugSphere)"/>
    <circle cx="305" cy="205" r="11" fill="url(#goldPayload)"/>
    <circle cx="260" cy="255" r="10" fill="url(#drugSphere)"/>
    <circle cx="295" cy="245" r="12" fill="url(#drugSphere)"/>
  </g>

  <!-- Released Targeted Drug Payloads Stream Leaving the Gate -->
  <g filter="url(#nanoGlow)">
    <!-- Trajectory Stream Vectors -->
    <path d="M350,200 Q400,190 460,170" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-opacity="0.7"/>
    <path d="M360,225 Q420,230 480,240" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-opacity="0.7"/>

    <!-- Released Particles -->
    <circle cx="410" cy="185" r="9" fill="url(#drugSphere)"/>
    <circle cx="455" cy="170" r="10" fill="url(#goldPayload)"/>
    <circle cx="430" cy="235" r="8" fill="url(#goldPayload)"/>
    <circle cx="485" cy="240" r="11" fill="url(#drugSphere)"/>
    <circle cx="530" cy="200" r="8" fill="url(#drugSphere)"/>
  </g>
</svg>
